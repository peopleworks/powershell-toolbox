<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>PowerShell Toolbox</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; display: grid; place-items: center;
      background: radial-gradient(circle at 15% 10%, #24567d, #0b1525 65%); color: #f2f7ff;
      font: 36px/1.3 "Segoe UI", sans-serif; }
    main { width: 980px; padding: 65px; border: 1px solid #6984a7; border-radius: 28px;
      background: #17283baa; box-shadow: 0 25px 70px #0005; }
    small { color: #75d9c5; letter-spacing: .18em; font-size: 19px; text-transform: uppercase; }
    h1 { margin: 20px 0; font-size: 68px; letter-spacing: -.04em; }
    p { margin: 0; color: #bfd0e8; }
  </style>
</head>
<body><main><small>Scripts listos para usar</small><h1>PowerShell Toolbox</h1><p>Archivos · Red · Imágenes · Datos · Reportes</p></main></body>
</html>
